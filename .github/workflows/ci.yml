name: .NET CI

on:
  push:
    branches: 
      - main
      - 'sprint-*'
  pull_request:
    branches: 
      - main
      - 'sprint-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SonarScanner for .NET
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Test with SonarQube
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        dotnet-sonarscanner begin /k:"ShaguittoScot_Slotify_Back" /o:"shaguittoscot" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"
        dotnet build --no-restore --configuration Release
        dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Notify on Failure
      if: failure()
      run: |
        curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"🚨 **CI Pipeline Failed** in \`${{ github.repository }}\`!\\nView run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.WEBHOOK_URL }}
