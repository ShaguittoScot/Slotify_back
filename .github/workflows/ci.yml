name: .NET CI

on:
  push:
    branches:
      - main
      - 'sprint-*'
      - 'Sprint-*'
  pull_request:
    branches:
      - main
      - 'sprint-*'
      - 'Sprint-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SonarScanner for .NET
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Test with SonarQube
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        dotnet-sonarscanner begin /k:"ShaguittoScot_Slotify_Back" /o:"shaguittoscot" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"
        dotnet build --no-restore --configuration Release
        dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [build]
    # Corre siempre, incluso si build falla
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Set status info
      id: status
      run: |
        if [[ "${{ needs.build.result }}" == "success" ]]; then
          echo "color=3066993"  >> $GITHUB_OUTPUT
          echo "emoji=✅"       >> $GITHUB_OUTPUT
          echo "title=Build exitoso" >> $GITHUB_OUTPUT
          echo "status=Build, tests y análisis SonarQube pasaron correctamente" >> $GITHUB_OUTPUT
        else
          echo "color=15158332" >> $GITHUB_OUTPUT
          echo "emoji=❌"       >> $GITHUB_OUTPUT
          echo "title=Build fallido" >> $GITHUB_OUTPUT
          echo "status=El pipeline falló — revisa los logs en GitHub Actions" >> $GITHUB_OUTPUT
        fi

    - name: Send Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        SHORT_SHA="${{ github.sha }}"
        SHORT_SHA="${SHORT_SHA:0:7}"
        COMMIT_MSG=$(git log -1 --pretty=%s | cut -c1-80)
        EVENT_TYPE="${{ github.event_name }}"

        if [ "$EVENT_TYPE" == "pull_request" ]; then
          BRANCH="${{ github.head_ref }}"
          ACTOR="${{ github.event.pull_request.user.login }}"
          TRIGGER="Pull Request #${{ github.event.pull_request.number }}"
        else
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          TRIGGER="Push a \`${BRANCH}\`"
        fi

        # Construir JSON de forma segura con jq (maneja tildes, comillas, etc.)
        PAYLOAD=$(jq -n \
          --arg title "${{ steps.status.outputs.emoji }} Slotify Backend CI — ${{ steps.status.outputs.title }}" \
          --arg description "${{ steps.status.outputs.status }}" \
          --argjson color ${{ steps.status.outputs.color }} \
          --arg trigger "$TRIGGER" \
          --arg branch "\`${BRANCH}\`" \
          --arg actor "$ACTOR" \
          --arg commit "\`${SHORT_SHA}\` — ${COMMIT_MSG}" \
          --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            embeds: [{
              title: $title,
              description: $description,
              color: $color,
              fields: [
                {name: "📋 Trigger",  value: $trigger, inline: true},
                {name: "🌿 Rama",     value: $branch,  inline: true},
                {name: "👤 Autor",    value: $actor,   inline: true},
                {name: "💬 Commit",   value: $commit,  inline: false},
                {name: "🔗 Ver run",  value: ("[Abrir en GitHub Actions](" + $run_url + ")"), inline: false}
              ],
              footer: {text: "Slotify Backend CI • GitHub Actions"},
              timestamp: $timestamp
            }]
          }')

        echo "Payload: $PAYLOAD"
        curl -i -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
